<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="여행 지도">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 rx=%2214%22 fill=%22%239CCBEF%22/%3E%3Cpath d=%22M32 12c-8 0-14 6-14 14 0 10 14 26 14 26s14-16 14-26c0-8-6-14-14-14z%22 fill=%22%23fff%22/%3E%3Ccircle cx=%2232%22 cy=%2226%22 r=%225%22 fill=%22%23185FA5%22/%3E%3C/svg%3E">
<title>여행 지도</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ffffff; --surface:#f7f6f3; --line:#ebe9e4; --line2:#d6d3cb; --text:#1d1d1b; --sub:#6b6a65; --muted:#9a988f;
  --accent:#185FA5; --accent-bg:#E6F1FB; --danger:#A32D2D;
  --mapbg:#fbfaf8; --land:#efeeea; --rline:rgba(0,0,0,.045); --pline:#d9d7d0; --halo:#fbfaf8;
  --star:#F2A900; --food:#FF6B3D; --cafe:#B07A3B; --sight:#1FA37A;
  --r:12px;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#141413; --surface:#1f1f1d; --line:#2c2c29; --line2:#44443f; --text:#eeede8; --sub:#a9a79f; --muted:#77756e;
    --accent:#85B7EB; --accent-bg:#0C2A47; --danger:#F09595;
    --mapbg:#1a1a18; --land:#2a2a27; --rline:rgba(255,255,255,.05); --pline:#3d3d39; --halo:#1a1a18; }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:"Noto Sans KR",system-ui,-apple-system,sans-serif;font-size:15px;line-height:1.5}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
button{font:inherit;color:inherit;background:none;border:1px solid var(--line2);border-radius:10px;padding:8px 14px;cursor:pointer}
button:active{transform:scale(.98)}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--bg);font-weight:500}
button.ghost{border-color:transparent}
button.danger{color:var(--danger);border-color:transparent}
input,textarea{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line2);border-radius:10px;padding:9px 12px;width:100%}
textarea{min-height:90px;resize:vertical}
.wrap{max-width:560px;margin:0 auto}
header{display:flex;align-items:center;gap:8px;padding:14px 16px 4px}
header h1{font-size:19px;font-weight:700;margin:0;letter-spacing:-.3px}
header .stats{font-size:13px;color:var(--sub)}
header .sp{flex:1}
.iconbtn{border:none;padding:8px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center}
.iconbtn svg{width:22px;height:22px}
.bar{display:flex;align-items:center;gap:6px;padding:4px 10px 8px;min-height:40px}
.bar{flex-wrap:wrap;row-gap:6px}.bar .back,.bar .name,.bar .meta,.filters button{white-space:nowrap}.filters{margin-left:auto}
.bar .back{border:none;padding:6px 6px;color:var(--accent);font-weight:500}
.bar .name{font-weight:500}
.bar .meta{color:var(--sub);font-size:13px}
.bar .sp{flex:1}
.filters{display:flex;gap:6px}
.filters button{padding:5px 11px;font-size:13px;border-radius:999px;display:inline-flex;align-items:center;gap:5px}
.filters button i{width:8px;height:8px;border-radius:50%;display:inline-block}
.filters button.on{background:var(--text);color:var(--bg);border-color:var(--text)}
#mapbox{position:relative;margin:0 8px;border-radius:var(--r);background:var(--mapbg);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#map{display:block;width:100%;height:62vh;max-height:640px}
#map .base{fill:var(--land)}
#map path.rg{stroke:var(--rline);stroke-width:.7;vector-effect:non-scaling-stroke;transition:fill .3s,opacity .3s}
#map path.pv{fill:none;stroke:var(--pline);stroke-width:1;vector-effect:non-scaling-stroke;pointer-events:none}
#map path.hit{fill:transparent;cursor:pointer}
#map path.rg.sel{stroke:var(--text);stroke-width:1.8}
#map .dim{opacity:.3}
#map.dots path.rg{opacity:.55}
#map.dots path.rg.dim{opacity:.18}
#map text{font-family:inherit;fill:var(--sub);cursor:pointer;text-anchor:middle;dominant-baseline:central;paint-order:stroke;stroke:var(--halo);stroke-linejoin:round}
#map text.big{fill:var(--text)}
#map rect.inset{fill:none;stroke:var(--line2);stroke-dasharray:6 5;vector-effect:non-scaling-stroke}
#map .dot .glow{animation:pulse 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
#map .dot{cursor:pointer}
@keyframes pulse{0%,100%{opacity:.25;transform:scale(1)}50%{opacity:.6;transform:scale(1.35)}}
.zoomctl{position:absolute;right:8px;bottom:8px;display:flex;flex-direction:column;gap:6px}
.zoomctl button{width:36px;height:36px;padding:0;background:var(--bg);border-color:var(--line)}
.pop{position:absolute;left:10px;right:56px;bottom:10px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:none;cursor:pointer}
.pop.on{display:block}
.pop .r1{display:flex;align-items:center;gap:6px}
.pop b{font-weight:500}
.pop small{color:var(--sub);font-size:12px}
.hint{text-align:center;font-size:12px;color:var(--muted);margin:8px 0 2px}
.tabs{display:flex;gap:4px;padding:14px 16px 0;border-bottom:1px solid var(--line)}
.tabs button{border:none;border-radius:0;padding:8px 10px;color:var(--sub);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--text);border-bottom-color:var(--text)}
.section{padding:4px 16px 24px}
.row{display:flex;align-items:center;gap:10px;padding:11px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.row .sw{width:14px;height:14px;border-radius:4px;flex:none}
.row .t{flex:1;min-width:0}
.row .t b{font-weight:500}
.row .t small{display:block;color:var(--sub);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .n{color:var(--sub);font-size:13px;white-space:nowrap}
.rank{width:30px;text-align:center;font-weight:700;font-size:15px;flex:none;color:var(--sub)}
.rank.top{color:var(--star)}
.empty{color:var(--muted);font-size:14px;padding:16px 2px}
.subseg{display:flex;gap:6px;padding:12px 0 6px}
.subseg button{padding:5px 12px;font-size:13px;border-radius:999px}
.subseg button.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.big{display:flex;align-items:baseline;gap:8px;padding:16px 2px 6px}
.big .pct{font-size:36px;font-weight:700;letter-spacing:-1px}
.big .of{color:var(--sub)}
.prog{display:flex;align-items:center;gap:10px;padding:7px 2px;cursor:pointer}
.prog .nm{width:42px;font-size:14px}
.prog .track{flex:1;height:10px;border-radius:5px;background:var(--surface);overflow:hidden}
.prog .fill{height:100%;border-radius:5px;background:var(--accent)}
.prog .v{width:78px;text-align:right;font-size:13px;color:var(--sub);white-space:nowrap}
/* stars */
.stars{position:relative;display:inline-block;font-size:13px;letter-spacing:1px;line-height:1;color:var(--line2);white-space:nowrap;vertical-align:middle}
.stars .on{position:absolute;left:0;top:0;overflow:hidden;color:var(--star)}
.sval{font-size:12px;color:var(--sub);margin-left:4px;vertical-align:middle}
.starpick{display:flex;align-items:center;gap:2px;touch-action:none}
.starpick .s{position:relative;font-size:34px;line-height:1;color:var(--line2);width:36px;text-align:center;cursor:pointer;user-select:none}
.starpick .s .h{position:absolute;left:0;top:0;width:var(--w,0%);overflow:hidden;color:var(--star);text-align:left;padding-left:1px}
.starpick .val{margin-left:10px;font-size:15px;font-weight:500;min-width:28px}
.panel{display:none;margin:12px 8px 0;border:1px solid var(--line);border-radius:16px;background:var(--bg)}
.panel.on{display:block}
.panel .hd{display:flex;align-items:center;gap:8px;padding:10px 8px 4px 16px}
.panel .hd h3{margin:0;font-size:18px;font-weight:700;flex:1;min-width:0}
.panel .hd h3 small{font-size:13px;font-weight:400;color:var(--sub);margin-left:6px}
.panel .bd{padding:0 16px 18px}
.gauge{position:absolute;left:10px;top:10px;display:flex;align-items:center;gap:7px;padding:5px 11px 5px 6px;border-radius:999px;background:var(--bg);border:1px solid var(--line);cursor:pointer;z-index:2}
.gauge svg{width:26px;height:26px;transform:rotate(-90deg)}
.gauge b{font-size:15px;font-weight:700;letter-spacing:-.3px}
.bubble{position:absolute;left:10px;right:56px;bottom:10px;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:10px 10px 10px 14px;display:none;align-items:center;gap:10px}
.bubble.on{display:flex}
.bubble .t{flex:1;min-width:0}
.bubble .t b{font-weight:700;font-size:16px}
.bubble .t small{display:block;font-size:12px;color:var(--sub)}
.bubble .go{padding:8px 14px;border-radius:999px;font-weight:500;white-space:nowrap}
.bubble .go.on{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.inline-confirm{display:flex;align-items:center;gap:8px;margin-top:20px;padding:10px 12px;border-radius:12px;background:var(--surface)}
.inline-confirm span{flex:1;font-size:14px}
.lbl{font-size:13px;color:var(--sub);margin:16px 0 8px;display:flex;align-items:center;gap:8px}
.lbl .sp{flex:1}
.visit{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;background:var(--surface)}
.visit .t{flex:1}
.visit .t small{display:block;font-size:12px;color:var(--sub)}
.sw-toggle{width:48px;height:28px;border-radius:14px;background:var(--line2);position:relative;border:none;padding:0;flex:none;transition:background .2s}
.sw-toggle::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .2s}
.sw-toggle.on{background:var(--accent)}
.sw-toggle.on::after{left:23px}
.sw-toggle.lock{opacity:.6}
.palette{display:flex;flex-wrap:wrap;gap:8px}
.palette button{width:30px;height:30px;border-radius:50%;padding:0;border:2px solid transparent}
.palette button.on{border-color:var(--text)}
.palette button.auto{width:auto;border-radius:999px;padding:0 10px;font-size:12px;border:1px solid var(--line2);height:30px}
.palette button.auto.on{border:2px solid var(--text)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{padding:6px 12px;font-size:13px;border-radius:999px}
.seg button.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.place{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer;align-items:flex-start}
.place .ic{width:36px;height:36px;border-radius:10px;flex:none;display:flex;align-items:center;justify-content:center;color:#fff}
.place .ic svg{width:20px;height:20px}
.place .info{flex:1;min-width:0}
.place .info b{font-weight:500}
.place .menu{font-size:13px;color:var(--text);opacity:.8}
.place .memo{font-size:13px;color:var(--sub);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:2px}
.field{display:block;margin-top:14px}
.field>span{display:block;font-size:13px;color:var(--sub);margin-bottom:6px}
.actions{display:flex;gap:8px;margin-top:20px}
.actions .sp{flex:1}
.dialog{position:absolute;inset:0;z-index:5;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.35);padding:24px}
.dialog.on{display:flex}
.dialog .box{background:var(--bg);border-radius:16px;padding:20px;max-width:360px;width:100%}
.dialog .box p{margin:0 0 16px;white-space:pre-line}
.dialog .box .actions{margin-top:0;justify-content:flex-end;flex-wrap:wrap}
.imgview{margin:6px 8px 10px;border-radius:16px;background:#1d1d1b;display:none;flex-direction:column;align-items:center;gap:12px;padding:14px}
.imgview.on{display:flex}
.imgview img{max-width:100%;border-radius:12px;background:#fff}
.imgview .actions{margin:0}
.imgview button{color:#fff;border-color:rgba(255,255,255,.4)}
.imgview button.primary{color:#141413;background:#fff;border-color:#fff}
.imgview p{color:#ddd;font-size:13px;margin:0;text-align:center}
.toast{position:absolute;left:50%;top:10px;transform:translateX(-50%) translateY(-10px);background:var(--text);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:14px;opacity:0;transition:all .2s;z-index:50;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;transform:translateX(-50%)}
.mode{font-size:12px;color:var(--muted);text-align:center;padding:4px 16px 20px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>여행 지도</h1>
      <div class="stats" id="stats">불러오는 중</div>
    </div>
    <div class="sp"></div>
    <button class="iconbtn" id="shotBtn" aria-label="지도 이미지 저장"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="15" rx="3"/><circle cx="12" cy="12.5" r="3.5"/><path d="M8 5l1.5-2h5L16 5"/></svg></button>
    <button class="iconbtn" id="menuBtn" aria-label="백업 메뉴"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/></svg></button>
  </header>
  <div class="imgview" id="imgview"><img id="shotImg" alt="색칠한 여행 지도"><p id="shotNote"></p><div class="actions"><button id="shotClose">닫기</button><button class="primary" id="shotSave">이미지 저장</button></div></div>
  <div class="bar" id="bar"></div>
  <div id="mapbox">
    <svg id="map" preserveAspectRatio="xMidYMid meet"></svg>
    <div class="gauge" id="gauge" role="button" aria-label="전국 정복률"><svg viewBox="0 0 36 36"><circle cx="18" cy="18" r="15" fill="none" stroke="var(--line)" stroke-width="5"/><circle id="gArc" cx="18" cy="18" r="15" fill="none" stroke="var(--accent)" stroke-width="5" stroke-linecap="round" stroke-dasharray="0 94.25"/></svg><b id="gPct">0%</b></div>
    <div class="pop" id="pop"></div>
    <div class="bubble" id="bubble"></div>
    <div class="toast" id="toast"></div>
    <div class="dialog" id="dialog"><div class="box"><p id="dlgText"></p><div class="actions" id="dlgActions"></div></div></div>
    <div class="zoomctl">
      <button id="zin" aria-label="확대">+</button>
      <button id="zout" aria-label="축소">−</button>
    </div>
  </div>
  <p class="hint" id="hint"></p>
  <div class="panel" id="sheet">
    <div class="hd"><h3 id="shTitle"></h3><button class="iconbtn" id="shClose" aria-label="닫기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <div class="bd" id="shBody"></div>
  </div>
  <div class="tabs" id="tabs">
    <button data-tab="list" class="on">다녀온 곳</button>
    <button data-tab="best">베스트</button>
    <button data-tab="prog">정복률</button>
  </div>
  <div class="section" id="tabBody"></div>
  <div class="mode" id="mode"></div>
</div>

<input type="file" id="importFile" accept="application/json,.json" style="display:none">

  const regs = MAP.regions.filter(r => r.prov === pid);

      || `<div class="empty">${catFilter === 'all' ? '맛집, 카페, 관광지를 추가해 보세요' : CATNAME[catFilter] + ' 기록이 없어요'}</div>`}</div>`;
  $('#visitT').onclick = () => {
    if (hasPlaces) { toast('장소 기록이 있으면 색칠이 유지돼요'); return; }
    const st = rd(id); st.visited = !st.visited; persist(id); renderAll();
  };
  B.querySelectorAll('#pal button').forEach(b => b.onclick = () => { const st = rd(id); st.color = b.dataset.c || null; persist(id); renderAll(); });
  $('#addPlace').onclick = () => openPlaceEditor(null);
  B.querySelectorAll('#catSeg button').forEach(b => b.onclick = () => { catFilter = b.dataset.cat; renderRegionSheet(); });
  B.querySelectorAll('.place').forEach(el => el.onclick = () => openPlaceEditor(el.dataset.pid));
}

function openPlaceEditor(pid) {
  const id = sheetRegion; const s = peek(id);
  const orig = pid ? s.places.find(p => p.id === pid) : null;
  const P = orig ? { ...orig } : { id: uid(), cat: catFilter !== 'all' ? catFilter : 'food', name: '', menu: '', rating: 0, memo: '', createdAt: Date.now() };
  editing = P.id; const B = $('#shBody');
  const sync = () => { P.name = $('#pname').value.trim(); P.menu = $('#pmenu').value.trim(); P.memo = $('#pmemo').value; };

  const draw = () => {
    B.innerHTML = `
      <div class="lbl">${orig ? '장소 수정' : '새 장소'}</div>
      <div class="seg" id="pcat">${CATS.map(([k, n]) => `<button data-cat="${k}" class="${P.cat === k ? 'on' : ''}">${n}</button>`).join('')}</div>
      <label class="field"><span>이름</span><input id="pname" maxlength="60" placeholder="해운대 원조할매국밥" value="${esc(P.name)}"></label>
      <label class="field"><span>대표 메뉴</span><input id="pmenu" maxlength="40" placeholder="${P.cat === 'food' ? '수육 백반' : P.cat === 'cafe' ? '아인슈페너' : '일몰 전망대'}" value="${esc(P.menu)}"></label>
      <div class="field"><span>별점 (반 개 단위로 눌러요)</span><div class="starpick" id="pstar">${[1, 2, 3, 4, 5].map(i => { const f = Math.max(0, Math.min(1, P.rating - (i - 1))); return `<span class="s" data-i="${i}" style="--w:${f * 100}%">★<span class="h">★</span></span>`; }).join('')}<span class="val">${P.rating ? P.rating.toFixed(1) : '0'}</span></div></div>
      <label class="field"><span>메모</span><textarea id="pmemo" maxlength="2000" placeholder="웨이팅 30분, 오전에 가면 한산해요">${esc(P.memo)}</textarea></label>
      <p id="perr" style="color:var(--danger);font-size:13px;margin:8px 0 0;display:none">이름을 입력해 주세요</p>
      <div class="actions">${orig ? '<button class="danger" id="pdel">삭제</button>' : ''}<span class="sp"></span><button class="ghost" id="pcancel">취소</button><button class="primary" id="psave">저장</button></div>`;
    B.querySelectorAll('#pcat button').forEach(b => b.onclick = () => { sync(); P.cat = b.dataset.cat; draw(); });
    B.querySelectorAll('#pstar .s').forEach(el => el.onclick = e => {
      sync(); const rc = el.getBoundingClientRect(); const i = +el.dataset.i; const v = e.clientX - rc.left < rc.width / 2 ? i - 0.5 : i;
      P.rating = P.rating === v ? 0 : v; draw();
    });
    $('#pname').oninput = () => { $('#perr').style.display = 'none'; };
    $('#pcancel').onclick = () => { editing = null; renderRegionSheet(); };
    $('#psave').onclick = () => {
      sync(); if (!P.name) { $('#perr').style.display = 'block'; $('#pname').focus(); return; }
      const st = rd(id); const i = st.places.findIndex(p => p.id === P.id); if (i >= 0) st.places[i] = P; else st.places.push(P);
      persist(id); editing = null; renderAll(); renderRegionSheet(); toast('저장했어요');
    };
    if (orig) $('#pdel').onclick = () => {
      const act = B.querySelector('.actions'); act.outerHTML = `<div class="inline-confirm"><span>'${esc(orig.name)}'을(를) 삭제할까요?</span><button class="ghost" id="pdelNo">취소</button><button class="primary" id="pdelYes">삭제</button></div>`;
      $('#pdelNo').onclick = () => { sync(); draw(); };
      $('#pdelYes').onclick = () => { const st = rd(id); st.places = st.places.filter(p => p.id !== P.id); persist(id); editing = null; renderAll(); renderRegionSheet(); toast('삭제했어요'); };
    };
  };
  draw();
}

/* ---------- plain download (outside claude.ai) ---------- */
function plainDownload(name, data, type) {
  const blob = data instanceof Blob ? data : new Blob([data], { type });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}
/* ---------- map image ---------- */
let shotBlob = null;
async function makeShot() {
  const W = 1080, H = 1440; const dark = false;
  const v = MAP.regions.filter(r => colored(r.id)).length; const pct = (v / MAP.regions.length * 100).toFixed(1);
  const places = allPlaces().length; const provs = new Set(MAP.regions.filter(r => colored(r.id)).map(r => r.prov)).size;
  const mb = [10, 10, MAP.w - 10, MAP.h - 10]; const scale = Math.min(900 / (mb[2] - mb[0]), 1100 / (mb[3] - mb[1]));
  const tx = (W - (mb[2] - mb[0]) * scale) / 2 - mb[0] * scale, ty = 230 - mb[1] * scale;
  let s = `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}"><rect width="${W}" height="${H}" fill="#FBFAF8"/>`;
  s += `<text x="80" y="120" font-family="Noto Sans KR, Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-size="56" font-weight="700" fill="#1d1d1b">나의 여행 지도</text>`;
  s += `<text x="80" y="178" font-family="Noto Sans KR, Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-size="30" fill="#6b6a65">전국 ${MAP.regions.length}곳 중 ${v}곳 · ${pct}% · 시·도 ${provs}/17 · 장소 ${places}곳</text>`;
  s += `<g transform="translate(${tx.toFixed(1)} ${ty.toFixed(1)}) scale(${scale.toFixed(4)})">`;
  for (const p of MAP.provinces) s += `<path d="${p.d}" fill="#EFEEEA"/>`;
  for (const r of MAP.regions) if (colored(r.id)) s += `<path d="${r.d}" fill="${colorOf(r.id)}" stroke="rgba(0,0,0,.05)" stroke-width="0.8"/>`;
  for (const p of MAP.provinces) s += `<path d="${p.d}" fill="none" stroke="#D9D7D0" stroke-width="1.2"/>`;
  s += `<rect x="${MAP.ul[0]}" y="${MAP.ul[1]}" width="${MAP.ul[2]}" height="${MAP.ul[3]}" rx="8" fill="none" stroke="#D6D3CB" stroke-dasharray="6 5"/></g></svg>`;
  const url = URL.createObjectURL(new Blob([s], { type: 'image/svg+xml' }));
  const img = await new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = url; });
  const c = document.createElement('canvas'); c.width = W; c.height = H; c.getContext('2d').drawImage(img, 0, 0); URL.revokeObjectURL(url);
  return await new Promise(res => c.toBlob(res, 'image/png'));
}
$('#shotBtn').onclick = async () => {
  try { shotBlob = await makeShot(); } catch (e) { toast('이미지를 만들지 못했어요'); return; }
  $('#shotImg').src = URL.createObjectURL(shotBlob); $('#shotNote').textContent = ''; $('#imgview').style.display = 'flex';
};
$('#shotClose').onclick = () => { $('#imgview').style.display = 'none'; };
$('#shotSave').onclick = async () => {
  const dl = window.claude && await claude.use('downloads').catch(() => null);
  if (!dl) { try { plainDownload('나의-여행-지도.png', shotBlob); $('#shotNote').textContent = '저장이 안 되면 이미지를 길게 눌러 저장해 주세요.'; } catch (e) { $('#shotNote').textContent = '이미지를 길게 눌러 저장해 주세요.'; } return; }
  try { await dl.save({ filename: `나의-여행-지도.png`, data: shotBlob }); toast('이미지를 저장했어요'); $('#imgview').style.display = 'none'; }
  catch (e) { if (e && e.code !== 'declined') $('#shotNote').textContent = '저장하지 못했어요. 이미지를 길게 눌러 저장해 주세요.'; }
};

/* ---------- backup ---------- */
$('#menuBtn').onclick = async () => {
  const v = await ask('백업\n기록을 파일로 저장하거나, 저장해 둔 백업 파일을 불러올 수 있어요.', [['닫기', null, 'ghost'], ['불러오기', 'import'], ['내보내기', 'export', 'primary']]);
  if (v === 'export') doExport(); else if (v === 'import') $('#importFile').click();
};
async function doExport() {
  const json = JSON.stringify({ app: 'travel-map', version: 2, exportedAt: new Date().toISOString(), regions: STATE });
  const d = new Date(); const name = `여행지도-백업-${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}.json`;
  const dl = window.claude && await claude.use('downloads').catch(() => null);
  if (dl) { try { await dl.save({ filename: name, data: json }); toast('백업 파일을 저장했어요'); } catch (e) { if (e && e.code !== 'declined') toast('저장하지 못했어요'); } return; }
  try { plainDownload(name, json, 'application/json'); toast('백업 파일을 저장했어요'); } catch (e) { try { await navigator.clipboard.writeText(json); toast('백업 내용을 클립보드에 복사했어요'); } catch (e2) { toast('이 화면에서는 내보낼 수 없어요'); } }
}
$('#importFile').onchange = async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  let data; try { data = JSON.parse(await f.text()); } catch (err) { toast('백업 파일을 읽지 못했어요'); return; }
  if (!data || data.app !== 'travel-map' || !data.regions) { toast('여행 지도 백업 파일이 아니에요'); return; }
  if (!await ask(`백업의 ${Object.keys(data.regions).length}개 지역 기록을 지금 기록에 합칠까요?`, [['취소', false, 'ghost'], ['합치기', true, 'primary']])) return;
  let n = 0;
  for (const [rid, raw] of Object.entries(data.regions)) {
    const tid = REG[rid] ? rid : (MAP.old || {})[rid] || (PROV[rid] ? regionAt(rid) : null); if (!tid) continue; const inc = normalize(raw || {}); const cur = rd(tid);
    cur.visited = cur.visited || inc.visited; cur.color = cur.color || inc.color;
    for (const p of inc.places) if (!cur.places.some(q => q.id === p.id)) cur.places.push(p);
    await persist(tid); n++;
  }
  renderAll(); toast(`기록 ${n}건을 불러왔어요`);
};

/* ---------- boot ---------- */
async function boot() {
  { const hb = homeBox(); fitW = hb.w; setVB(hb); } renderLabels(); renderBar(); setHint(); paint(); renderTab();
  let db = null, user = null, id = null;
  if (window.claude && claude.use) { try { [db, user] = await Promise.all([claude.use('db'), claude.use('user')]); id = user ? await user.id() : null; } catch (e) {} }
  if (db && id) { store.kind = 'cloud'; await cloud.init(db, id); $('#mode').textContent = 'claude.ai 계정에 저장돼요 · 폰과 PC에서 같은 기록을 볼 수 있어요'; }
  else { store.kind = 'local'; try { await local.init(); $('#mode').textContent = '이 기기의 브라우저에 저장돼요 · 가끔 백업 파일로 내보내 두세요'; } catch (e) { $('#mode').textContent = '이 화면에서는 저장할 수 없어요. 새로고침하면 기록이 사라져요'; } }
  store.ready = true; renderAll();
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();
</script>
